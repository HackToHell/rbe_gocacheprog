services:
  bazel-remote:
    image: quay.io/bazel-remote/bazel-remote
    command:
      - --dir=/data
      - --max_size=20
      - --storage_mode=uncompressed
    ports:
      - "9092:9092"
      - "8080:8080"
    volumes:
      - bazel-remote-data:/data

  builder:
    build:
      context: ..
      dockerfile: bench/Dockerfile
    depends_on:
      bazel-remote:
        condition: service_started
    environment:
      GOCACHE_RBE_TARGET: "bazel-remote:9092"
      GOCACHE_RBE_INSTANCE: ""
      GOCACHE_RBE_CACHE_DIR: "/tmp/gocache-rbe-cache"
      GOCACHE_RBE_CACHE_SIZE_MB: "10240"
      GOCACHE_RBE_LOG_LEVEL: "info"
      GOCACHE_RBE_CONNECT_TIMEOUT: "30s"
      GOCACHE_RBE_REQUEST_TIMEOUT: "120s"
      K8S_BUILD_TARGETS: "${K8S_BUILD_TARGETS:-./cmd/kubectl/... ./cmd/kubeadm/...}"
    volumes:
      - ./results:/results

volumes:
  bazel-remote-data:
